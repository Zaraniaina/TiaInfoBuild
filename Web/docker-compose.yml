version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tia-build-postgres
    environment:
      POSTGRES_DB: tia_build_db
      POSTGRES_USER: tia_user
      POSTGRES_PASSWORD: tia_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tia-network

  redis:
    image: redis:7-alpine
    container_name: tia-build-redis
    ports:
      - "6379:6379"
    networks:
      - tia-network

  backend:
    build: ./backend
    container_name: tia-build-backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - tia-network
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: tia-build-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - tia-network

  nginx:
    image: nginx:1.27-alpine
    container_name: tia-build-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend-dist:/app/static:ro
    depends_on:
      - frontend
    networks:
      - tia-network

volumes:
  postgres_data:
  frontend-dist:

networks:
  tia-network:
    driver: bridge
