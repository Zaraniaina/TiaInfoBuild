<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#146ef5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIA INFO BUILD</title>
    <script>
      // Thème AVANT le premier paint : même source de vérité que l'app
      // (localStorage 'tia-theme', défaut light) — supprime tout flash.
      try {
        var t = localStorage.getItem('tia-theme');
        if (t !== 'dark' && t !== 'light') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <style>
      /* CSS critique : visible avant le bundle. Source de vérité documentée
         dans src/styles/brand.css (section écran de chargement). */
      html, body { margin: 0; height: 100%; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #F8FAFC;
        color: #64748B;
      }
      html[data-theme='dark'] body { background: #0F172A; color: #94A3B8; }

      #loading-screen, .app-boot {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }

      /* Logo : une seule variante visible selon le thème, aucun texte dupliqué */
      .loading-logo { width: 88px; height: 88px; object-fit: contain; animation: boot-pulse 1.8s ease-in-out infinite; }
      .loading-logo-dark { display: none; }
      html[data-theme='dark'] .loading-logo-dark { display: block; }
      html[data-theme='dark'] .loading-logo-light { display: none; }

      /* Barre de progression fine, indéterminée */
      .loading-bar {
        width: 168px;
        height: 3px;
        margin-top: 24px;
        border-radius: 999px;
        background: #E2E8F0;
        overflow: hidden;
      }
      html[data-theme='dark'] .loading-bar { background: rgba(255, 255, 255, 0.08); }
      .loading-bar-fill {
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #2563EB;
        animation: boot-slide 1.4s ease-in-out infinite;
      }
      html[data-theme='dark'] .loading-bar-fill { background: #3B82F6; }

      .loading-msg { margin: 14px 0 0; font-size: 0.9rem; }

      .retry-btn {
        display: none;
        margin-top: 24px;
        padding: 9px 22px;
        font: inherit;
        font-size: 0.9rem;
        color: #475569;
        background: transparent;
        border: 1px solid #CBD5E1;
        border-radius: 8px;
        cursor: pointer;
      }
      .retry-btn:hover { background: #F1F5F9; }
      html[data-theme='dark'] .retry-btn { color: #CBD5E1; border-color: rgba(255, 255, 255, 0.16); }
      html[data-theme='dark'] .retry-btn:hover { background: rgba(255, 255, 255, 0.06); }
      .retry-note { display: none; margin: 10px 0 0; font-size: 0.85rem; }

      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.97); opacity: 0.88; }
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-logo, .loading-bar-fill { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading-screen" role="status" aria-live="polite" aria-busy="true">
        <img class="loading-logo loading-logo-light" src="/logo-loading-light.png" alt="TIA INFO BUILD" width="88" height="88" />
        <img class="loading-logo loading-logo-dark" src="/logo-loading-dark.png" alt="" aria-hidden="true" width="88" height="88" />
        <div class="loading-bar" aria-hidden="true"><div class="loading-bar-fill"></div></div>
        <p class="loading-msg">Chargement de l'application…</p>
        <p class="retry-note">Le chargement prend plus de temps que prévu. Vérifiez votre connexion.</p>
        <button class="retry-btn" type="button" onclick="window.location.reload()">Recharger</button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Bouton « Recharger » après 15 s si l'application n'a pas démarré
      setTimeout(function () {
        var loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          var note = loadingScreen.querySelector('.retry-note');
          var btn = loadingScreen.querySelector('.retry-btn');
          if (note) note.style.display = 'block';
          if (btn) btn.style.display = 'inline-block';
        }
      }, 15000);
    </script>
  </body>
</html>
