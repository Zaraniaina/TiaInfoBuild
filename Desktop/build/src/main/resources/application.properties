spring.application.name=build
spring.main.web-application-type=none

# --- Base de donnees H2 embarquee (fichier local, pas de serveur externe) ---
# Fichier stocke dans le dossier utilisateur : ~/.tia-info-build/data/tiadb.mv.db
# AUTO_SERVER=TRUE permet d'ouvrir plusieurs connexions/instances sur le meme fichier.
spring.datasource.url=jdbc:h2:file:${user.home}/.tia-info-build/data/tiadb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
