<!-- Vue Alertes Finance -->
<div class="alertes-view" data-view="alertes">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="mb-1"><i class="bi bi-bell me-2"></i>Alertes</h2>
            <p class="text-secondary mb-0">Tableau de bord des alertes financières et opérationnelles</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary" id="btnMarquerToutesLues">
                <i class="bi bi-check-all me-1"></i>Tout marquer lu
            </button>
            <button class="btn btn-outline-secondary" id="btnRefreshAlertes">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>
    </div>

    <!-- KPIs -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card text-center h-100 border-danger">
                <div class="card-body">
                    <div class="text-danger mb-2"><i class="bi bi-exclamation-octagon fs-2"></i></div>
                    <div class="fs-3 fw-bold text-danger" id="kpiAlerteCritique">—</div>
                    <div class="text-secondary small">Critiques non lues</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center h-100 border-warning">
                <div class="card-body">
                    <div class="text-warning mb-2"><i class="bi bi-exclamation-triangle fs-2"></i></div>
                    <div class="fs-3 fw-bold text-warning" id="kpiAlerteImportante">—</div>
                    <div class="text-secondary small">Importantes non lues</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center h-100">
                <div class="card-body">
                    <div class="text-info mb-2"><i class="bi bi-info-circle fs-2"></i></div>
                    <div class="fs-3 fw-bold" id="kpiAlerteInfo">—</div>
                    <div class="text-secondary small">Informations non lues</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center h-100">
                <div class="card-body">
                    <div class="text-success mb-2"><i class="bi bi-bell-slash fs-2"></i></div>
                    <div class="fs-3 fw-bold" id="kpiAlerteLues">—</div>
                    <div class="text-secondary small">Traitées aujourd'hui</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Filtres -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="searchAlerte" placeholder="Rechercher une alerte...">
                    </div>
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="filterGraviteAlerte">
                        <option value="">Toutes les gravités</option>
                        <option value="critique">Critique</option>
                        <option value="importante">Importante</option>
                        <option value="info">Information</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="filterTypeAlerte">
                        <option value="">Tous les types</option>
                        <option value="stock_bas">Stock bas</option>
                        <option value="facture_en_retard">Facture en retard</option>
                        <option value="budget_depasse">Budget dépassé</option>
                        <option value="echeance">Échéance</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="filterStatutAlerte">
                        <option value="non_lue">Non lues</option>
                        <option value="">Toutes</option>
                        <option value="lue">Lues</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Liste des alertes -->
    <div id="alertesContainer">
        <!-- Rempli par JS -->
    </div>
    <div class="text-center py-5 d-none" id="alertesEmpty">
        <i class="bi bi-bell-slash display-1 text-success"></i>
        <h4 class="mt-3">Aucune alerte</h4>
        <p class="text-secondary">Excellent ! Aucune alerte non lue pour le moment</p>
    </div>
    <div class="card-footer bg-white border-0 px-4 py-3" id="alertesPagination"></div>
</div>
