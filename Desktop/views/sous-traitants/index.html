<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sous-Traitants — TIA INFO BUILD</title>
  <link rel="stylesheet" href="../../public/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../public/bootstrap/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../public/tia-design.css">
</head>
<body>
<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0"><i class="bi bi-person-workspace me-2 text-primary"></i>Sous-Traitants</h2>
    <button class="btn btn-primary" id="btnNouveauST" data-permission="sousTraitants:create">
      <i class="bi bi-plus-lg me-1"></i>Nouveau sous-traitant
    </button>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white border-0 py-3">
      <div class="row g-3 align-items-center">
        <div class="col-md-4">
          <select class="form-select" id="filterChantierST">
            <option value="">Tous les chantiers</option>
          </select>
        </div>
        <div class="col-md-3">
          <input type="text" class="form-control" id="searchST" placeholder="Rechercher un sous-traitant...">
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>Nom</th>
              <th>Contact</th>
              <th>Spécialité</th>
              <th>Statut</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="stTableBody">
            <tr><td colspan="6" class="text-center py-4 text-secondary">Chargement...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="../../public/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="sous-traitants.js"></script>
</body>
</html>
