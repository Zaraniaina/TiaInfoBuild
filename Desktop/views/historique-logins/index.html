<!-- Vue Historique des connexions -->
<div class="historique-view" data-view="historique-logins">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="mb-1"><i class="bi bi-clock-history me-2"></i>Historique des connexions</h2>
            <p class="text-secondary mb-0">Suivi des connexions et tentatives d'accès</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-success btn-sm" id="btnExportCsv">
                <i class="bi bi-file-earmark-spreadsheet me-1"></i>Exporter CSV
            </button>
            <button class="btn btn-outline-danger btn-sm" id="btnExportPdf">
                <i class="bi bi-file-earmark-pdf me-1"></i>Exporter PDF
            </button>
        </div>
    </div>

    <!-- Filtres -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label small fw-semibold">Utilisateur</label>
                    <select class="form-select" id="filterUtilisateur">
                        <option value="">Tous les utilisateurs</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">Statut</label>
                    <select class="form-select" id="filterStatut">
                        <option value="">Tous</option>
                        <option value="1">Réussis</option>
                        <option value="0">Échoués</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">Date début</label>
                    <input type="date" class="form-control" id="filterDateDebut">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-primary w-100" id="btnFiltrer">
                        <i class="bi bi-funnel me-1"></i>Filtrer
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tableau -->
    <div class="card">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Connexions</h5>
            <span class="text-secondary small" id="historiqueCount">0 résultat</span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="historiqueTable">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Date / Heure</th>
                            <th>Utilisateur</th>
                            <th>Email</th>
                            <th>Rôle</th>
                            <th>Statut</th>
                            <th>Adresse IP</th>
                            <th>Motif échec</th>
                        </tr>
                    </thead>
                    <tbody id="historiqueTbody">
                        <tr><td colspan="8" class="text-center py-4 text-secondary">Chargement…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white border-0 px-4 py-3" id="historiquePagination"></div>
    </div>
</div>
