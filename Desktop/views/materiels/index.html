<!-- Vue Matériels & Maintenances -->
<div class="materiels-view" data-view="materiels">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="mb-1"><i class="bi bi-tools me-2"></i>Matériels & Engins</h2>
            <p class="text-secondary mb-0">Gestion du parc matériel et des maintenances</p>
        </div>
        <button class="btn btn-primary" id="btnNouveauMateriel" data-permission="materiels:create">
            <i class="bi bi-plus-lg me-1"></i>Nouveau matériel
        </button>
    </div>

    <!-- Filtres -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="searchMateriel" placeholder="Rechercher un matériel...">
                    </div>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="filterEtatMateriel">
                        <option value="">Tous les états</option>
                        <option value="disponible">Disponible</option>
                        <option value="en_utilisation">En utilisation</option>
                        <option value="en_maintenance">En maintenance</option>
                        <option value="hors_service">Hors service</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex justify-content-end">
                    <button class="btn btn-outline-secondary" id="btnRefreshMateriels">
                        <i class="bi bi-arrow-clockwise"></i> Actualiser
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tableau Matériels -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="materielsTable">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 40px;">#</th>
                            <th>Désignation</th>
                            <th>Type / Catégorie</th>
                            <th>N° de série</th>
                            <th>État</th>
                            <th>Prochaine maintenance</th>
                            <th style="width: 100px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="materielsTbody">
                        <!-- Rempli par JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- État vide -->
    <div class="text-center py-5 d-none" id="materielsEmpty">
        <i class="bi bi-tools display-1 text-secondary"></i>
        <h4 class="mt-3">Aucun matériel</h4>
        <p class="text-secondary">Commencez par ajouter votre premier matériel</p>
        <button class="btn btn-primary" id="btnFirstMateriel" data-permission="materiels:create">
            <i class="bi bi-plus-lg me-1"></i>Ajouter un matériel
        </button>
    </div>
</div>

<!-- Modale Matériel -->
<div class="modal fade" id="modalMateriel" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-tools me-2"></i>Nouveau matériel</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="formMateriel">
                <div class="modal-body">
                    <input type="hidden" id="materielId" name="id">
                    <div class="mb-3">
                        <label class="form-label required">Désignation *</label>
                        <input type="text" class="form-control" name="designation" id="matDesignation" required>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Type / Catégorie</label>
                            <input type="text" class="form-control" name="type" id="matType" placeholder="Ex: Grue, Camion...">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">N° de série</label>
                            <input type="text" class="form-control" name="numeroSerie" id="matNumeroSerie">
                        </div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">État</label>
                            <select class="form-select" name="etat" id="matEtat">
                                <option value="disponible">Disponible</option>
                                <option value="en_utilisation">En utilisation</option>
                                <option value="en_maintenance">En maintenance</option>
                                <option value="hors_service">Hors service</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Prochaine maintenance</label>
                            <input type="date" class="form-control" name="prochaineMaintenance" id="matProchaineMaintenance">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>
