<!-- Vue Mouvements de Stock -->
<div class="mouvements-view" data-view="mouvements">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="mb-1"><i class="bi bi-arrow-left-right me-2"></i>Mouvements de stock</h2>
            <p class="text-secondary mb-0">Historique des entrées et sorties de matériaux</p>
        </div>
        <button class="btn btn-primary" id="btnNouveauMouvement" data-permission="mouvements:create">
            <i class="bi bi-plus-circle me-1"></i>Nouveau mouvement
        </button>
    </div>

    <!-- KPIs -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card text-center h-100">
                <div class="card-body">
                    <div class="text-success mb-2"><i class="bi bi-arrow-down-circle fs-2"></i></div>
                    <div class="fs-3 fw-bold" id="kpiEntrees">—</div>
                    <div class="text-secondary small">Entrées ce mois</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center h-100">
                <div class="card-body">
                    <div class="text-danger mb-2"><i class="bi bi-arrow-up-circle fs-2"></i></div>
                    <div class="fs-3 fw-bold" id="kpiSorties">—</div>
                    <div class="text-secondary small">Sorties ce mois</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center h-100">
                <div class="card-body">
                    <div class="text-primary mb-2"><i class="bi bi-box-seam fs-2"></i></div>
                    <div class="fs-3 fw-bold" id="kpiArticlesMouvements">—</div>
                    <div class="text-secondary small">Articles concernés</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center h-100">
                <div class="card-body">
                    <div class="text-warning mb-2"><i class="bi bi-currency-euro fs-2"></i></div>
                    <div class="fs-3 fw-bold" id="kpiValeurMouvements">—</div>
                    <div class="text-secondary small">Valeur mouvements</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Filtres -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="searchMouvement" placeholder="Article, chantier...">
                    </div>
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="filterTypeMouvement">
                        <option value="">Tous les types</option>
                        <option value="entree">Entrée</option>
                        <option value="sortie">Sortie</option>
                        <option value="transfert">Transfert</option>
                        <option value="ajustement">Ajustement</option>
                        <option value="retour">Retour</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="date" class="form-control" id="filterDateDebutMouvement" placeholder="Date début">
                </div>
                <div class="col-md-2">
                    <input type="date" class="form-control" id="filterDateFinMouvement" placeholder="Date fin">
                </div>
                <div class="col-auto d-flex gap-2">
                    <button class="btn btn-outline-secondary" id="btnExportMouvements">
                        <i class="bi bi-download me-1"></i>Exporter
                    </button>
                    <button class="btn btn-outline-secondary" id="btnRefreshMouvements">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tableau -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="mouvementsTable">
                    <thead class="table-light">
                        <tr>
                            <th style="width:40px;">#</th>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Article</th>
                            <th>Quantité</th>
                            <th>Unité</th>
                            <th>Chantier</th>
                            <th>Motif</th>
                            <th style="width:90px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="mouvementsTbody"></tbody>
                </table>
            </div>
            <div class="card-footer bg-white border-0 px-4 py-3" id="mouvementsPagination"></div>
        </div>
        <div class="text-center py-5 d-none" id="mouvementsEmpty">
            <i class="bi bi-arrow-left-right display-1 text-secondary"></i>
            <h4 class="mt-3">Aucun mouvement</h4>
            <p class="text-secondary">Aucun mouvement de stock pour cette période</p>
        </div>
    </div>
</div>

<!-- Modale Mouvement -->
<div class="modal fade" id="modalMouvement" tabindex="-1" aria-labelledby="modalMouvementLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalMouvementLabel"><i class="bi bi-arrow-left-right me-2"></i>Nouveau mouvement</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="formMouvement" novalidate>
                <div class="modal-body">
                    <input type="hidden" name="id" id="mouvementId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="mouvementType">Type de mouvement *</label>
                            <select class="form-select" name="type" id="mouvementType" required>
                                <option value="entree">Entrée (réception)</option>
                                <option value="sortie">Sortie (utilisation)</option>
                                <option value="transfert">Transfert</option>
                                <option value="ajustement">Ajustement inventaire</option>
                                <option value="retour">Retour fournisseur</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="mouvementDate">Date *</label>
                            <input type="date" class="form-control" name="dateMouvement" id="mouvementDate" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="mouvementArticle">Article *</label>
                            <select class="form-select" name="articleId" id="mouvementArticle" required>
                                <option value="">Sélectionner un article</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="mouvementQuantite">Quantité *</label>
                            <input type="number" class="form-control" name="quantite" id="mouvementQuantite" step="0.01" min="0.01" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="mouvementUnite">Unité</label>
                            <input type="text" class="form-control" name="unite" id="mouvementUnite" placeholder="kg, m², pcs...">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="mouvementChantier">Chantier</label>
                            <select class="form-select" name="chantierId" id="mouvementChantier">
                                <option value="">— Aucun —</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                        <label class="form-label" for="mouvementPrixUnitaire">Prix unitaire</label>
                        <div class="input-group">
                            <input type="number" class="form-control" name="prixUnitaire" id="mouvementPrixUnitaire" step="0.01" min="0">
                            <span class="input-group-text currency-symbol">Ar</span>
                        </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="mouvementMotif">Motif / Description</label>
                            <textarea class="form-control" name="motif" id="mouvementMotif" rows="2" placeholder="Raison du mouvement..."></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
