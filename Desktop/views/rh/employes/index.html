<!-- Vue Liste des Employés -->
<div class="employes-view" data-view="employes">
    <!-- Header avec actions -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="mb-1"><i class="bi bi-people me-2"></i>Employés</h2>
            <p class="text-secondary mb-0">Gestion du personnel</p>
        </div>
        <button class="btn btn-primary" id="btnNouvelEmploye" data-permission="employes:create">
            <i class="bi bi-person-plus me-1"></i>Nouvel employé
        </button>
    </div>

    <!-- Filtres et recherche -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label visually-hidden" for="searchEmploye">Rechercher</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="searchEmploye"
                            placeholder="Rechercher un employé...">
                    </div>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="filterStatutEmploye">
                        <option value="">Tous les statuts</option>
                        <option value="actif">Actif</option>
                        <option value="inactif">Inactif</option>
                        <option value="conge">En congé</option>
                        <option value="suspendu">Suspendu</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="filterPoste">
                        <option value="">Tous les postes</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button class="btn btn-outline-secondary" id="btnExportEmployes">
                        <i class="bi bi-download me-1"></i>Exporter
                    </button>
                    <button class="btn btn-outline-secondary" id="btnRefreshEmployes">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tableau des employés -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive" style="max-height: calc(100vh - 280px); overflow-y: auto;">
                <table class="table table-hover mb-0" id="employesTable">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 40px;">#</th>
                            <th>Employé</th>
                            <th>Poste</th>
                            <th class="d-none d-md-table-cell">Téléphone / Email</th>
                            <th class="d-none d-lg-table-cell">Salaire base</th>
                            <th>Statut</th>
                            <th style="width: 100px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employesTbody">
                        <!-- Rempli par JS -->
                    </tbody>
                </table>
            </div>
            <div class="card-footer bg-white border-0 px-4 py-3" id="employesPagination">
                <!-- Rempli par JS -->
            </div>
        </div>
    </div>

    <!-- État vide -->
    <div class="text-center py-5 d-none" id="employesEmpty">
        <i class="bi bi-people display-1 text-secondary"></i>
        <h4 class="mt-3">Aucun employé</h4>
        <p class="text-secondary">Commencez par ajouter votre premier employé</p>
        <button class="btn btn-primary" id="btnFirstEmploye" data-permission="employes:create">
            <i class="bi bi-person-plus me-1"></i>Ajouter un employé
        </button>
    </div>
</div>

<!-- Modale Nouvel/Édition Employé -->
<div class="modal fade" id="modalEmploye" tabindex="-1" aria-labelledby="modalEmployeLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalEmployeLabel"><i class="bi bi-person me-2"></i>Nouvel employé</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
            </div>
            <form id="formEmploye" novalidate>
                <div class="modal-body">
                    <input type="hidden" name="id" id="employeId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label required" for="empNom">Nom *</label>
                            <input type="text" class="form-control" name="nom" id="empNom" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required" for="empPrenom">Prénom *</label>
                            <input type="text" class="form-control" name="prenom" id="empPrenom" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="empEmail">Email</label>
                            <input type="email" class="form-control" name="email" id="empEmail">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="empTelephone">Téléphone</label>
                            <input type="tel" class="form-control" name="telephone" id="empTelephone">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required" for="empPoste">Poste *</label>
                            <input type="text" class="form-control" name="poste" id="empPoste" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="empSalaireBase">Salaire base (€/mois)</label>
                            <input type="number" class="form-control" name="salaireBase" id="empSalaireBase" step="0.01" min="0">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
