<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="h3 mb-0 text-gray-800">Pointages</h1>
        <p class="text-muted">Suivi journalier des heures de travail</p>
    </div>
    <button class="btn btn-tia-primary" id="btnNouveauPointage">
        <i class="bi bi-clock-history me-2"></i>Saisir un pointage
    </button>
</div>

<!-- Filtres -->
<div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label text-muted small">Employé</label>
                <select id="filterEmploye" class="form-select">
                    <option value="">Tous les employés</option>
                    <!-- Options chargées dynamiquement -->
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label text-muted small">Chantier</label>
                <select id="filterChantier" class="form-select">
                    <option value="">Tous les chantiers</option>
                    <!-- Options chargées dynamiquement -->
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label text-muted small">Date Début</label>
                <input type="date" id="filterDateDebut" class="form-control">
            </div>
            <div class="col-md-2">
                <label class="form-label text-muted small">Date Fin</label>
                <input type="date" id="filterDateFin" class="form-control">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-outline-secondary w-100" id="btnResetFilters">
                    <i class="bi bi-arrow-counterclockwise me-2"></i>Réinitialiser
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Tableau des pointages -->
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="pointagesTable">
                <thead class="bg-light">
                    <tr>
                        <th>Date</th>
                        <th>Employé</th>
                        <th>Chantier</th>
                        <th>H. Début</th>
                        <th>H. Fin</th>
                        <th>Total Heures</th>
                        <th>Type</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="pointagesTbody">
                    <!-- Données injectées ici -->
                </tbody>
            </table>
        </div>
        
        <!-- Empty State -->
        <div id="pointagesEmpty" class="text-center py-5 d-none">
            <div class="display-1 text-muted mb-3"><i class="bi bi-clock-history"></i></div>
            <h5 class="text-muted">Aucun pointage trouvé</h5>
            <p class="text-muted small">Modifiez vos filtres ou saisissez un nouveau pointage.</p>
        </div>
    </div>
</div>

<!-- Modale Saisie Pointage -->
<div class="modal fade" id="modalPointage" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title"><i class="bi bi-clock-history me-2"></i>Saisie d'un pointage</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="formPointage">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Employé <span class="text-danger">*</span></label>
                        <select class="form-select" id="pointageEmploye" required>
                            <option value="">Sélectionner un employé...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Chantier (Optionnel)</label>
                        <select class="form-select" id="pointageChantier">
                            <option value="">Sélectionner un chantier...</option>
                        </select>
                        <div class="form-text">Laissez vide si travail au dépôt/bureau.</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label class="form-label fw-bold">Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="pointageDate" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Heure de début</label>
                            <input type="time" class="form-control" id="pointageHeureDebut" value="08:00">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Heure de fin</label>
                            <input type="time" class="form-control" id="pointageHeureFin" value="17:00">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Type de présence <span class="text-danger">*</span></label>
                        <select class="form-select" id="pointageType" required>
                            <option value="present">Présent</option>
                            <option value="absence_justifiee">Absence justifiée</option>
                            <option value="absence_injustifiee">Absence injustifiée</option>
                            <option value="maladie">Maladie</option>
                            <option value="conge">Congé</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Notes</label>
                        <textarea class="form-control" id="pointageNotes" rows="2" placeholder="Informations complémentaires..."></textarea>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-tia-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>
