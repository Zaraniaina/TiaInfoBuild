<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — TIA INFO BUILD</title>
  <link rel="stylesheet" href="../../public/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../public/bootstrap/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../public/tia-design.css">
</head>
<body>
<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0"><i class="bi bi-bell me-2 text-primary"></i>Notifications</h2>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-primary" id="btnMarquerToutesLues" data-permission="notifications:update">
        <i class="bi bi-check2-all me-1"></i>Tout marquer lu
      </button>
      <button class="btn btn-outline-danger" id="btnPurge" data-permission="notifications:delete">
        <i class="bi bi-trash me-1"></i>Purger les lues
      </button>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white border-0 py-3">
      <div class="row g-3 align-items-center">
        <div class="col-md-3">
          <select class="form-select" id="filterLu">
            <option value="">Toutes</option>
            <option value="0">Non lues</option>
            <option value="1">Lues</option>
          </select>
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>Titre</th>
              <th>Message</th>
              <th>Type</th>
              <th>Statut</th>
              <th>Date</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="notifTableBody">
            <tr><td colspan="7" class="text-center py-4 text-secondary">Chargement...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="../../public/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="notifications.js"></script>
</body>
</html>
