<!-- Vue Notifications (Alertes) -->
<div class="alertes-view" data-view="alertes">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="mb-1"><i class="bi bi-bell me-2"></i>Notifications</h2>
            <p class="text-secondary mb-0">Gestion de vos alertes et rappels</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary" id="btnMarkAllRead">
                <i class="bi bi-check-all"></i> Tout marquer comme lu
            </button>
            <button class="btn btn-outline-secondary" id="btnRefreshAlertes">
                <i class="bi bi-arrow-clockwise"></i> Actualiser
            </button>
        </div>
    </div>

    <!-- Filtres -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="searchAlerte" placeholder="Rechercher une notification...">
                    </div>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="filterAlerteStatut">
                        <option value="non_lue">Non lues</option>
                        <option value="lue">Lues</option>
                        <option value="">Toutes</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="filterAlerteGravite">
                        <option value="">Toutes gravités</option>
                        <option value="critique">Critique</option>
                        <option value="elevee">Élevée</option>
                        <option value="moyenne">Moyenne</option>
                        <option value="faible">Faible</option>
                        <option value="info">Info</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Tableau Alertes -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive" style="max-height: calc(100vh - 280px); overflow-y: auto;">
                <table class="table table-hover mb-0" id="alertesTable">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 40px;">#</th>
                            <th>Gravité</th>
                            <th>Titre</th>
                            <th>Message</th>
                            <th>Date</th>
                            <th>Statut</th>
                            <th style="width: 120px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="alertesTbody">
                        <!-- Rempli par JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- État vide -->
    <div class="text-center py-5 d-none" id="alertesEmpty">
        <i class="bi bi-bell-slash display-1 text-secondary"></i>
        <h4 class="mt-3">Aucune notification</h4>
        <p class="text-secondary">Vous n'avez aucune nouvelle notification.</p>
    </div>
</div>
