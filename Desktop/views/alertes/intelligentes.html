<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alertes Intelligentes — TIA INFO BUILD</title>
  <link rel="stylesheet" href="../../public/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../public/bootstrap/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../public/tia-design.css">
</head>
<body>
<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0"><i class="bi bi-robot me-2 text-primary"></i>Alertes Intelligentes</h2>
    <button class="btn btn-outline-secondary" id="btnRefreshAlertesIA">
      <i class="bi bi-arrow-clockwise me-1"></i>Actualiser
    </button>
  </div>

  <!-- Cartes d'alertes intelligentes -->
  <div class="row g-3 mb-4" id="alertesIACards">
    <div class="col-md-4">
      <div class="card border-0 shadow-sm h-100 border-start border-4 border-danger">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="text-secondary small mb-1">Factures en retard critiques</div>
              <div class="h3 mb-0 text-danger" id="aiFacturesRetard">0</div>
              <small class="text-secondary">+30 jours sans paiement</small>
            </div>
            <i class="bi bi-exclamation-triangle fs-1 text-danger opacity-25"></i>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm h-100 border-start border-4 border-warning">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="text-secondary small mb-1">Dépenses dépassement</div>
              <div class="h3 mb-0 text-warning" id="aiDepensesDepassement">0</div>
              <small class="text-secondary">>80% du budget chantier</small>
            </div>
            <i class="bi bi-graph-up-arrow fs-1 text-warning opacity-25"></i>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm h-100 border-start border-4 border-info">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="text-secondary small mb-1">Habilitations à renouveler</div>
              <div class="h3 mb-0 text-info" id="aiHabilitations">0</div>
              <small class="text-secondary">CACES, permis, formations</small>
            </div>
            <i class="bi bi-person-check fs-1 text-info opacity-25"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Liste des alertes intelligentes -->
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white border-0 py-3">
      <h5 class="mb-0"><i class="bi bi-list-ul me-2"></i>Détail des alertes</h5>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Type</th>
              <th>Priorité</th>
              <th>Message</th>
              <th>Entité</th>
              <th>Date</th>
              <th class="text-end">Action</th>
            </tr>
          </thead>
          <tbody id="alertesIATbody">
            <tr><td colspan="6" class="text-center py-4 text-secondary">Chargement...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="../../public/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="alertes-intelligentes.js"></script>
</body>
</html>
