<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="h3 mb-0 text-gray-800">Factures</h1>
        <p class="text-muted">Gestion de la facturation et des encaissements</p>
    </div>
    <button class="btn btn-tia-primary" id="btnNouvelleFacture" data-permission="factures:create">
        <i class="bi bi-receipt me-2"></i>Nouvelle Facture
    </button>
</div>

<!-- Filtres -->
<div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-4">
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="searchFacture" class="form-control" placeholder="Rechercher par n°, client...">
                </div>
            </div>
            <div class="col-md-3">
                <select id="filterStatutFacture" class="form-select">
                    <option value="">Tous les statuts</option>
                    <option value="brouillon">Brouillon</option>
                    <option value="emise">Émise</option>
                    <option value="partiel">Partiellement payée</option>
                    <option value="paye">Payée</option>
                    <option value="annulee">Annulée</option>
                </select>
            </div>
        </div>
    </div>
</div>

<!-- Tableau des Factures -->
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive" style="max-height: calc(100vh - 280px); overflow-y: auto;">
            <table class="table table-hover align-middle mb-0" id="facturesTable">
                <thead class="bg-light">
                    <tr>
                        <th>N° Facture</th>
                        <th>Client</th>
                        <th>Date d'émission</th>
                        <th>Échéance</th>
                        <th class="text-end">Montant TTC</th>
                        <th class="text-end">Reste à payer</th>
                        <th>Statut</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="facturesTbody">
                    <!-- Données injectées ici -->
                </tbody>
            </table>
        </div>
        
        <!-- Empty State -->
        <div id="facturesEmpty" class="text-center py-5 d-none">
            <div class="display-1 text-muted mb-3"><i class="bi bi-receipt"></i></div>
            <h5 class="text-muted">Aucune facture trouvée</h5>
            <p class="text-muted small">Créez votre première facture ou modifiez votre recherche.</p>
        </div>
    </div>
</div>

<!-- Modale Saisie Facture -->
<div class="modal fade" id="modalFacture" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title"><i class="bi bi-receipt me-2"></i>Nouvelle Facture</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="formFacture">
                <input type="hidden" id="factureId">
                <input type="hidden" id="factureEntrepriseId">
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Numéro de facture</label>
                            <input type="text" class="form-control" id="factureNumero" placeholder="Ex: FAC-2023-001" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Client *</label>
                            <select class="form-select" id="factureClient" required>
                                <option value="">Sélectionner un client...</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Contrat associé (Optionnel)</label>
                            <select class="form-select" id="factureContrat">
                                <option value="">Aucun contrat (facture directe)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Date d'émission <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="factureDateEmission" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Date d'échéance <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="factureDateEcheance" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Montant HT <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="number" step="0.01" class="form-control" id="factureMontantHT" required>
                                <span class="input-group-text currency-symbol">Ar</span>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">TVA (%)</label>
                            <select class="form-select" id="factureTVA">
                                <option value="20">20%</option>
                                <option value="10">10%</option>
                                <option value="5.5">5.5%</option>
                                <option value="0">Exonéré</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Montant TTC <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="number" step="0.01" class="form-control" id="factureMontantTTC" required>
                                <span class="input-group-text currency-symbol">Ar</span>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Statut</label>
                        <select class="form-select" id="factureStatut">
                            <option value="brouillon">Brouillon</option>
                            <option value="emise">Émise</option>
                            <option value="partiel">Partiellement payée</option>
                            <option value="paye">Payée</option>
                            <option value="annulee">Annulée</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Notes / Conditions</label>
                        <textarea class="form-control" id="factureNotes" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-tia-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modale Paiement -->
<div class="modal fade" id="modalPaiement" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title"><i class="bi bi-cash-coin me-2"></i>Enregistrer un paiement</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="formPaiement">
                <input type="hidden" id="paiementFactureId">
                <div class="modal-body">
                    <div class="alert alert-info">
                        Reste à payer : <strong id="paiementResteLabel">0.00 €</strong>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Date du paiement <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="paiementDate" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Montant <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="number" step="0.01" class="form-control" id="paiementMontant" required>
                            <span class="input-group-text">€</span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Mode de paiement <span class="text-danger">*</span></label>
                        <select class="form-select" id="paiementMode" required>
                            <option value="virement">Virement bancaire</option>
                            <option value="cheque">Chèque</option>
                            <option value="cb">Carte bancaire</option>
                            <option value="especes">Espèces</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-success">Valider le paiement</button>
                </div>
            </form>
        </div>
    </div>
</div>
