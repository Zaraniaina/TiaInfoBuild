<!-- Vue Paiements -->
<div class="paiements-view" data-view="paiements">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="mb-1"><i class="bi bi-credit-card me-2"></i>Paiements</h2>
            <p class="text-secondary mb-0">Suivi des paiements par facture</p>
        </div>
        <button class="btn btn-primary" id="btnNouveauPaiement">
            <i class="bi bi-plus-circle me-1"></i>Enregistrer un paiement
        </button>
    </div>

    <!-- KPIs -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card text-center h-100">
                <div class="card-body">
                    <div class="text-success mb-2"><i class="bi bi-check-circle fs-2"></i></div>
                    <div class="fs-3 fw-bold" id="kpiPaiementsRecus">—</div>
                    <div class="text-secondary small">Paiements reçus</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center h-100">
                <div class="card-body">
                    <div class="text-warning mb-2"><i class="bi bi-hourglass-split fs-2"></i></div>
                    <div class="fs-3 fw-bold" id="kpiPaiementsEnAttente">—</div>
                    <div class="text-secondary small">En attente</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center h-100">
                <div class="card-body">
                    <div class="text-primary mb-2"><i class="bi bi-currency-euro fs-2"></i></div>
                    <div class="fs-3 fw-bold" id="kpiMontantRecu">—</div>
                    <div class="text-secondary small">Montant reçu (mois)</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center h-100">
                <div class="card-body">
                    <div class="text-danger mb-2"><i class="bi bi-exclamation-circle fs-2"></i></div>
                    <div class="fs-3 fw-bold" id="kpiMontantDu">—</div>
                    <div class="text-secondary small">Montant en retard</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Filtres -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="searchPaiement" placeholder="Rechercher par facture ou client...">
                    </div>
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="filterModePaiement">
                        <option value="">Tous les modes</option>
                        <option value="virement">Virement</option>
                        <option value="cheque">Chèque</option>
                        <option value="especes">Espèces</option>
                        <option value="carte">Carte bancaire</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="month" class="form-control" id="filterMoisPaiement">
                </div>
                <div class="col-auto d-flex gap-2">
                    <button class="btn btn-outline-secondary" id="btnExportPaiements">
                        <i class="bi bi-download me-1"></i>Exporter
                    </button>
                    <button class="btn btn-outline-secondary" id="btnRefreshPaiements">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tableau -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="paiementsTable">
                    <thead class="table-light">
                        <tr>
                            <th style="width:40px;">#</th>
                            <th>N° Facture</th>
                            <th>Client</th>
                            <th>Montant payé</th>
                            <th>Date paiement</th>
                            <th>Mode</th>
                            <th>Référence</th>
                            <th style="width:90px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="paiementsTbody"></tbody>
                </table>
            </div>
            <div class="card-footer bg-white border-0 px-4 py-3" id="paiementsPagination"></div>
        </div>
        <div class="text-center py-5 d-none" id="paiementsEmpty">
            <i class="bi bi-credit-card display-1 text-secondary"></i>
            <h4 class="mt-3">Aucun paiement</h4>
            <p class="text-secondary">Aucun paiement enregistré pour cette période</p>
        </div>
    </div>
</div>

<!-- Modale Paiement -->
<div class="modal fade" id="modalPaiement" tabindex="-1" aria-labelledby="modalPaiementLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalPaiementLabel"><i class="bi bi-credit-card me-2"></i>Enregistrer un paiement</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="formPaiement" novalidate>
                <div class="modal-body">
                    <input type="hidden" name="id" id="paiementId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="paiementFacture">Facture *</label>
                            <select class="form-select" name="factureId" id="paiementFacture" required>
                                <option value="">Sélectionner une facture</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="paiementMontant">Montant payé *</label>
                            <div class="input-group">
                                <input type="number" class="form-control" name="montant" id="paiementMontant" step="0.01" min="0.01" required>
                                <span class="input-group-text">€</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="paiementDate">Date de paiement *</label>
                            <input type="date" class="form-control" name="datePaiement" id="paiementDate" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="paiementMode">Mode de paiement *</label>
                            <select class="form-select" name="modePaiement" id="paiementMode" required>
                                <option value="">Choisir</option>
                                <option value="virement">Virement bancaire</option>
                                <option value="cheque">Chèque</option>
                                <option value="especes">Espèces</option>
                                <option value="carte">Carte bancaire</option>
                                <option value="prelevement">Prélèvement</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="paiementRef">Référence / N° transaction</label>
                            <input type="text" class="form-control" name="reference" id="paiementRef" placeholder="Ex: VIR-2026-001">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="paiementBanque">Banque</label>
                            <input type="text" class="form-control" name="banque" id="paiementBanque" placeholder="Ex: BNP Paribas">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="paiementNotes">Notes</label>
                            <textarea class="form-control" name="notes" id="paiementNotes" rows="2"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-outline-danger" id="btnDeletePaiement" style="display:none;">
                        <i class="bi bi-trash me-1"></i>Supprimer
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
