<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal d'audit — TIA INFO BUILD</title>
  <link href="../public/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="../public/bootstrap/icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f5f7fb; }
    .audit-card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-radius: 12px; }
    .log-entry { border-bottom: 1px solid #f1f3f5; padding: 12px 0; }
    .log-entry:last-child { border-bottom: none; }
    .log-action { font-family: 'Courier New', monospace; font-size: 0.85rem; }
    .log-module { text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="mb-0"><i class="bi bi-journal-text me-2"></i>Journal d'audit</h4>
        <p class="text-secondary mb-0 small">Traçabilité des actions sensibles</p>
      </div>
      <button class="btn btn-outline-secondary btn-sm" onclick="window.history.back()">
        <i class="bi bi-arrow-left me-1"></i>Retour
      </button>
    </div>

    <div class="card audit-card mb-3">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label small text-secondary">Module</label>
            <select id="filterModule" class="form-select form-select-sm">
              <option value="">Tous</option>
              <option>utilisateurs</option>
              <option>chantiers</option>
              <option>depenses</option>
              <option>factures</option>
              <option>entreprises</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small text-secondary">Utilisateur</label>
            <input type="text" id="filterUser" class="form-control form-control-sm" placeholder="Nom ou email">
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button class="btn btn-primary btn-sm w-100" id="btnFilter">
              <i class="bi bi-funnel me-1"></i>Filtrer
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="card audit-card">
      <div class="card-body">
        <div id="auditList"></div>
        <div id="auditEmpty" class="text-center py-5 d-none">
          <i class="bi bi-inbox fs-1 text-secondary"></i>
          <p class="text-secondary mt-2">Aucune entrée trouvée</p>
        </div>
      </div>
    </div>
  </div>

  <script src="../public/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>
    class AuditController {
      constructor() {
        this.limit = 50;
        this.offset = 0;
        this.bindEvents();
        this.loadRecent();
      }

      bindEvents() {
        document.getElementById('btnFilter')?.addEventListener('click', () => this.loadRecent());
      }

      async loadRecent() {
        const module = document.getElementById('filterModule')?.value || '';
        const userQuery = document.getElementById('filterUser')?.value?.trim() || '';
        const listEl = document.getElementById('auditList');
        const emptyEl = document.getElementById('auditEmpty');

        listEl.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></div>';
        emptyEl?.classList.add('d-none');

        try {
          const params = { limit: this.limit, offset: this.offset };
          const result = module
            ? await window.api.audit.invoke('byModule', window.AppState.entreprise.id, module, this.limit, this.offset)
            : await window.api.audit.invoke('recent', window.AppState.entreprise.id, this.limit);

          const items = result?.data ?? result;
          const logs = Array.isArray(items) ? items : (items?.items || []);

          if (userQuery && logs.length) {
            const q = userQuery.toLowerCase();
            const filtered = logs.filter(l =>
              (l.nom && l.nom.toLowerCase().includes(q)) ||
              (l.prenom && l.prenom.toLowerCase().includes(q)) ||
              (l.email && l.email.toLowerCase().includes(q))
            );
            logs.length = 0;
            logs.push(...filtered);
          }

          this.render(logs);
        } catch (error) {
          listEl.innerHTML = '<div class="alert alert-danger mb-0">Erreur lors du chargement du journal d\'audit.</div>';
        }
      }

      render(logs) {
        const listEl = document.getElementById('auditList');
        const emptyEl = document.getElementById('auditEmpty');

        if (!logs.length) {
          listEl.innerHTML = '';
          emptyEl?.classList.remove('d-none');
          return;
        }

        emptyEl?.classList.add('d-none');
        listEl.innerHTML = logs.map(log => {
          const date = new Date(log.dateAction).toLocaleString('fr-FR');
          const user = [log.prenom, log.nom].filter(Boolean).join(' ') || log.email || 'Système';
          return `
            <div class="log-entry">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <div class="log-module badge bg-secondary bg-opacity-10 text-secondary mb-1">${this.escapeHtml(log.module)}</div>
                  <div class="log-action text-dark">${this.escapeHtml(log.action)}</div>
                  ${log.entityId ? `<div class="small text-secondary">Entité #${log.entityId}</div>` : ''}
                </div>
                <div class="text-end">
                  <div class="small fw-semibold">${this.escapeHtml(user)}</div>
                  <div class="small text-secondary">${date}</div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new AuditController();
    });
  </script>
</body>
</html>
